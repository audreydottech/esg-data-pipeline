name: sync-github-data-to-s3

on:
  push

env:
  BUCKET_NAME: 'environmental-stock-data-bucket'
  AWS_REGION: 'us-east-2'

permissions:
  id-token: write
  contents: read

jobs:
  S3PackageUpload:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: s3FileUpload
          aws-region: ${{ env.AWS_REGION }}
          
      # Upload a file to AWS S3
      - name: Copy esg-stock-news3.json to S3
        run: |
          # aws s3 cp ./data/esg-stock-news3.json s3://${{ env.BUCKET_NAME }}/
          aws s3 cp ./data/esg-stock-prices.csv s3://${{ env.BUCKET_NAME }}/

